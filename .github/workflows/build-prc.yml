name: Build PRC

# 소스를 푸시하면 GitHub 서버에서 PRC를 빌드해 Artifacts로 올린다.
# 도구 체인은 prc-tools-remix v2.3.6이 배포하는 미리 빌드된 Ubuntu 24.04(noble) 패키지로 고정한다.
# (로컬 검증 환경도 Ubuntu 24.04 + prc-tools-remix 2.3.6 소스 빌드)

on:
  push:
    paths:
      - 'src/**'
      - 'tools/build-*.sh'
      - 'tools/prc-info.sh'
      - 'tools/test-compose.sh'
      - 'tools/test-johab.sh'
      - 'test/**'
      - '.github/workflows/build-prc.yml'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    env:
      DEBIAN_FRONTEND: noninteractive
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Install base packages
        run: |
          apt-get update -qq
          apt-get install -y -qq curl ca-certificates unzip git python3 > /dev/null
          # MnHangul5(OS 5) ARM 코드용 (tools/build-os5.sh)
          apt-get install -y -qq gcc-arm-none-eabi > /dev/null
          echo "::notice::$(arm-none-eabi-gcc --version | head -1)"

      - uses: actions/checkout@v4

      - name: Install prc-tools-remix 2.3.6 (pinned noble package)
        env:
          PRC_TOOLS_URL: https://github.com/jichu4n/prc-tools-remix/releases/download/v2.3.6/prc-tools-remix_2.3.6.noble_amd64.deb
        run: |
          set -e
          curl -sfL -o /tmp/prc-tools-remix.deb "$PRC_TOOLS_URL" \
            || { echo "::error::download failed: $PRC_TOOLS_URL"; exit 1; }
          if ! apt-get install -y -qq /tmp/prc-tools-remix.deb > /tmp/apt.log 2>&1; then
            echo "::error::apt install failed: $(tail -5 /tmp/apt.log | tr '\n' ' ')"
            exit 1
          fi
          echo "::notice::$(m68k-palmos-gcc --version | head -1)"

      # SDK는 커밋을 고정해 받는다(재현성). 올릴 때는 SDK_COMMIT만 바꾼다.
      - name: Install Palm OS SDK
        env:
          SDK_COMMIT: 1fa22066ca0f8b74949c14dd1d626294145d1c09
        run: |
          set -e
          curl -sfL -o /tmp/sdk.zip "https://github.com/jichu4n/palm-os-sdk/archive/$SDK_COMMIT.zip" \
            || { echo "::error::SDK download failed ($SDK_COMMIT)"; exit 1; }
          unzip -q -d /tmp /tmp/sdk.zip
          rm -rf /opt/palmdev
          mv "/tmp/palm-os-sdk-$SDK_COMMIT" /opt/palmdev
          palmdev-prep -d sdk-4 || { echo "::error::palmdev-prep failed"; exit 1; }

      # tools/build-*.sh 를 파일명 순서로 모두 실행한다 (build-hello.sh 는 외부 경로가 필요해 제외).
      # 저장소에 커밋된 bin/*.prc 가 새 결과로 오인되지 않도록 빌드 전에 지운다.
      - name: Build PRCs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          rm -f bin/*.prc
          mkdir -p build/logs
          count=0
          for script in tools/build-*.sh; do
            name=$(basename "$script" .sh)
            [ "$name" = "build-hello" ] && continue
            echo "::group::$script"
            if bash "$script" > "build/logs/$name.log" 2>&1; then
              cat "build/logs/$name.log"
              echo "::endgroup::"
            else
              cat "build/logs/$name.log"
              echo "::endgroup::"
              echo "::error::$script failed: $(tail -3 "build/logs/$name.log" | tr '\n' ' ')"
              exit 1
            fi
            count=$((count + 1))
          done
          if [ "$count" -eq 0 ]; then
            echo "::error::no build scripts found (tools/build-*.sh)"
            exit 1
          fi
          prcs=(bin/*.prc)
          if [ "${#prcs[@]}" -eq 0 ]; then
            echo "::error::no PRC produced"
            exit 1
          fi

      # 배포 빌드(진단 기록을 뺀 것, src/common/diag.h): 검사(%a5·재배치·진입점)만 하고 산출물로 올린다. bin/에는 넣지 않는다.
      - name: Build release variant (DIAG=0)
        shell: bash
        run: |
          set -euo pipefail
          for name in build-hangul build-sony build-core build-os5; do
            echo "::group::DIAG=0 $name"
            if DIAG=0 bash "tools/$name.sh" > "build/logs/$name-release.log" 2>&1; then
              cat "build/logs/$name-release.log"; echo "::endgroup::"
            else
              cat "build/logs/$name-release.log"; echo "::endgroup::"
              echo "::error::DIAG=0 $name failed: $(tail -3 "build/logs/$name-release.log" | tr '\n' ' ')"
              exit 1
            fi
          done
          for f in build/release/*.prc; do echo "::notice::release $(basename "$f") $(stat -c %s "$f") bytes"; done

      # 한글 조합 로직을 PC용으로 컴파일해 시험 (test/compose_test.py)
      - name: Test Hangul composition (keyboard, johab glyphs)
        shell: bash
        run: |
          apt-get install -y -qq gcc python3 > /dev/null
          if ! out=$(tools/test-compose.sh 2>&1); then
            echo "$out" | grep -E "FAIL|error" | head -10 | while read -r l; do echo "::error::$l"; done
            exit 1
          fi
          echo "::notice::compose test: $(echo "$out" | tail -1)"
          if ! out=$(tools/test-johab.sh 2>&1); then
            echo "$out" | grep -E "FAIL|rror" | head -10 | while read -r l; do echo "::error::$l"; done
            exit 1
          fi
          echo "::notice::johab test: $(echo "$out" | tail -1)"

      # OS 4/5 실제 낱말 선택 C 함수 본문을 추출해 호스트 gcc로 회귀시험
      # Palm ROM의 원래 WordBounds/CharAttr는 mock이며, 기기 시험을 대체하지 않는다.
      - name: Test OS4 and OS5 word bounds
        shell: bash
        run: |
          set -euo pipefail
          python3 test/word_bounds_host_test.py

      # OS 4·5 비교(TxtCompare·TxtCaselessCompare) 함수 본문을 추출해 정렬 성질·일치 길이를 회귀시험(원래 함수는 mock)
      - name: Test OS4 and OS5 compare
        shell: bash
        run: |
          set -euo pipefail
          python3 test/compare_host_test.py

      # PRC 구조(DB 이름·타입·크리에이터·리소스)와 날짜를 뺀 해시를 실행 요약에 표시
      - name: Inspect PRCs
        shell: bash
        run: |
          set -euo pipefail
          for f in bin/*.prc; do
            echo "::notice::$(tools/prc-info.sh "$f")"
            h=$({ head -c 36 "$f"; head -c 12 /dev/zero; tail -c +49 "$f"; } | sha256sum | cut -c1-16)
            echo "::notice::$(basename "$f") hash(no-date)=$h"
          done
          # 플러그인 코드 1KB 블록별 해시 (로컬 빌드와 비교용)
          if [ -f build/core/MnCo0000.bin ]; then
            b=build/core/MnCo0000.bin; n=$(( ($(stat -c %s $b) + 1023) / 1024 )); l=""
            for ((i=0; i<n; i++)); do l="$l $(dd if=$b bs=1024 skip=$i count=1 2>/dev/null | sha256sum | cut -c1-4)"; done
            echo "::notice::core blocks:$l"
            echo "::notice::traps: $(grep -A1 'trap #15' build/core/skwr.dis | grep -v trap | awk '{print $2}' | sort | uniq -c | tr '\n' ' ')"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prc
          path: |
            bin/*.prc
            build/logs/*.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prc-release
          path: build/release/*.prc
          if-no-files-found: ignore
