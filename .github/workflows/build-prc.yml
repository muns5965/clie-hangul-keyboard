name: Build PRC

# 소스를 푸시하면 GitHub 서버에서 PRC를 빌드해 Artifacts로 올린다.
# 도구 체인은 prc-tools-remix가 배포하는 미리 빌드된 Ubuntu 20.04(focal) 패키지를 쓴다.

on:
  push:
    paths:
      - 'src/**'
      - 'tools/build-*.sh'
      - '.github/workflows/build-prc.yml'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Install base packages
        run: |
          apt-get update -qq
          apt-get install -y -qq curl ca-certificates unzip git > /dev/null

      - uses: actions/checkout@v4

      # 결과(받은 패키지 주소, 실패 원인)는 ::notice / ::error 로 남겨 실행 요약 화면에 바로 보이게 한다.
      - name: Install prc-tools-remix (prebuilt focal package)
        run: |
          set -e
          rel=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" \
                  "https://api.github.com/repos/jichu4n/prc-tools-remix/releases/latest")
          tag=$(echo "$rel" | grep '"tag_name"' | head -1 | cut -d'"' -f4)
          assets=$(echo "$rel" | grep '"browser_download_url"' | cut -d'"' -f4 | tr '\n' ' ')
          echo "::notice::prc-tools-remix release=${tag:-none} assets=${assets:-none}"
          url=$(echo "$assets" | tr ' ' '\n' | grep 'focal' | grep '\.deb$' | head -1)
          if [ -z "$url" ]; then
            echo "::error::no focal .deb in prc-tools-remix release ${tag:-none}"
            exit 1
          fi
          echo "::notice::using $url"
          curl -sL -o /tmp/prc-tools-remix.deb "$url"
          if ! apt-get install -y -qq /tmp/prc-tools-remix.deb > /tmp/apt.log 2>&1; then
            echo "::error::apt install failed: $(tail -5 /tmp/apt.log | tr '\n' ' ')"
            exit 1
          fi
          v=$(m68k-palmos-gcc --version | head -1)
          echo "::notice::$v"

      - name: Install Palm OS SDK
        run: |
          set -e
          curl -sL -o /tmp/sdk.zip https://github.com/jichu4n/palm-os-sdk/archive/master.zip
          unzip -q -d /tmp /tmp/sdk.zip
          rm -rf /opt/palmdev
          mv /tmp/palm-os-sdk-master /opt/palmdev
          palmdev-prep -d sdk-4 || { echo "::error::palmdev-prep failed"; exit 1; }

      - name: Build PRCs
        run: |
          set -e
          if ! ./tools/build-diag.sh > build-diag.log 2>&1; then
            echo "::error::build-diag failed: $(tail -5 build-diag.log | tr '\n' ' ')"
            exit 1
          fi
          cat build-diag.log
          ls -l bin/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prc
          path: |
            bin/*.prc
            build-diag.log
            build/diag/build.log
          if-no-files-found: ignore
